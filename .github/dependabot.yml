# Dependabot version updates: one grouped pull request per ecosystem a week.
# Security updates are switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/e2e"
      - "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directories:
      - "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gomod:
        patterns:
          - "*"
